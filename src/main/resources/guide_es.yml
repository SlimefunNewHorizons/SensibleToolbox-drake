# Guia interna de SensibleToolbox (Español). Se muestra con /stb guide [tema] [pagina] es
# Se permiten codigos de color '&'. Cada id de tema debe existir tambien en guide_en.yml.
title: "Guía STB"

ui:
  index_header: "Índice"
  index_intro: "&7Haz clic en un tema para abrirlo o escribe &f/stb guide <tema>&7."
  index_hint: "&7Buscar: &f/stb guide search <palabra>&7  |  Idioma: &fes&7 / &fen"
  topic_hover: "&eHaz clic para abrir este tema"
  page: "&7Página &f{page}&7/&f{pages}"
  prev: "&a[« Anterior]"
  prev_hover: "&7Ir a la página anterior"
  next: "&a[Siguiente »]"
  next_hover: "&7Ir a la página siguiente"
  back_to_index: "&b[Índice]"
  back_to_index_hover: "&7Volver a la lista de temas"
  switch_language: "&d[View in English]"
  switch_language_hover: "&7Switch the guide to English"
  unknown_topic: "&cTema desconocido: &f{topic}&c. Elige uno del índice:"
  search_header: "Búsqueda: {term}"
  search_none: "&7Ningún tema menciona &f{term}&7."
  search_usage: "&cUso: &f/stb guide search <palabra>"

topics:
  start:
    title: "Primeros pasos"
    summary: "Qué es STB y cómo desbloquearlo"
    lines:
      - "&fSensibleToolbox (STB) añade máquinas, logística, energía"
      - "&fSCU, almacenamiento y herramientas útiles a Slimefun."
      - "&6¿Dónde están los ítems?"
      - "&7Abre &f/sf guide&7: STB usa dos categorías,"
      - "&e STB - Items &7y &eSTB - Blocks and Machines&7."
      - "&6Investigaciones (niveles de XP de Slimefun)"
      - "&7- &eHerramientas y Componentes&7: &f20 niveles"
      - "&7- &eMaquinaria y Energía&7: &f35 niveles"
      - "&7- &eAlmacenamiento Hiperespacial&7: &f45 niveles"
      - "&7Desbloquea la investigación una vez y luego fabrica"
      - "&7sus ítems normalmente."
      - "&6Fabricación"
      - "&7La mayoría usa la mesa de crafteo vanilla. Algunos salen"
      - "&7de máquinas (polvos, lingotes energizados, silicio)."
      - "&7El &eRecipe Book&7 muestra y puede fabricar cada receta;"
      - "&7búscalo con &f/stb recipe <texto>&7."
      - "&6Progresión sugerida"
      - "&71. Herramientas: Combine Hoe, Paintbrush, Tape Measure."
      - "&72. Machine Frame + Simple Circuit y un Heat Engine."
      - "&73. Barrotes de hierro como cables, Battery Box y Masher."
      - "&74. Smelter y Electrical Energizer para piezas avanzadas."
      - "&75. Módulos del Item Router, BSU/HSU y Auto Farms."
      - "&76. SCU Relays e Hypersender para redes entre mundos."
      - "&6Interactuar con bloques"
      - "&7Clic derecho en casi todos los bloques STB abre su menú."
      - "&7Al romperlos se devuelven con sus datos cuando es posible."
      - "&7Sigue con &f/stb guide energy&7."

  energy:
    title: "Energía SCU"
    summary: "Cables, redes, carga y baterías"
    lines:
      - "&fLas máquinas STB funcionan con &eSCU&f (Sensible Charge Units)."
      - "&7Las tasas se muestran en &fSCU/t&7 (por tick, 20 t = 1 s)."
      - "&6Cables y redes de energía"
      - "&7Los &fbarrotes de hierro (Iron Bars)&7 son los cables. Los"
      - "&7cables que se tocan forman una &ered de energía&7; toda"
      - "&7máquina STB adyacente se une a ella. Los generadores"
      - "&7aportan energía y los consumidores la toman."
      - "&7Poner un cable une redes; romperlo puede dividirlas."
      - "&7La energía se reparte cada &fenergy.tick_rate&7 ticks."
      - "&6Carga de las máquinas"
      - "&7Cada máquina tiene un búfer interno (carga máxima) y una"
      - "&7tasa máxima de carga. El medidor de su menú muestra ambos."
      - "&6Ranura de carga y dirección"
      - "&7Las máquinas tienen una ranura para Energy Cells. El botón"
      - "&7de dirección de carga elige el flujo:"
      - "&e MACHINE&7: la celda carga la máquina."
      - "&e CELL&7: la máquina carga la celda."
      - "&6Almacenamiento"
      - "&e10K Battery Box&7: 10.000 SCU, 100 SCU/t."
      - "&e50K Battery Box&7: 50.000 SCU, 500 SCU/t."
      - "&7Las baterías solo intercambian energía si su modo de"
      - "&7redstone lo permite (por defecto: ignorar = siempre activo)."
      - "&e10K / 50K Energy Cell&7: portátiles, 100 / 500 SCU/t."
      - "&6Energía a distancia"
      - "&eSCU Relay&7: fabrica dos &eUnlinked SCU Relay&7 juntos para"
      - "&7obtener un par enlazado (100.000 SCU compartidos). Ambos"
      - "&7tienen siempre el mismo nivel y solo funcionan si los dos"
      - "&7están colocados. Si están en mundos distintos, inserta un"
      - "&eSubspace Transponder&7 en cada uno. Clic izq.: refrescar."
      - "&6Medición"
      - "&eMultimeter&7: clic derecho en cables o máquinas para ver la"
      - "&7red, la carga y productores/consumidores."
      - "&ePower Monitor&7: muestra ganancia/pérdida en carteles."
      - "&eHolographic Monitor&7: lo mismo, con un holograma"
      - "&7(requiere HolographicDisplays)."

  generators:
    title: "Generadores"
    summary: "Energía térmica, bio, magmática y solar"
    lines:
      - "&7Los generadores llenan su búfer y luego alimentan la red."
      - "&7Queman más lento cuando su búfer supera el 75 por ciento."
      - "&eHeat Engine&7: quema todo lo que arde en un horno."
      - "&7 Búfer 5.000 SCU, 50 SCU/t."
      - "&eBio Engine&7: convierte materia orgánica (cultivos,"
      - "&7 brotes, comida...) en energía. Búfer 2.500 SCU, 50 SCU/t."
      - "&eMagmatic Engine&7: convierte cubos de lava en energía."
      - "&7 Búfer 2.500 SCU, 50 SCU/t. Devuelve los cubos vacíos."
      - "&7La lista de combustibles aparece en la entrada de cada"
      - "&7motor dentro de la guía de Slimefun."
      - "&eBasic Solar&7: hasta 0,5 SCU/t con sol directo y cielo"
      - "&7 abierto. Necesita una &ePV Cell&7 instalada."
      - "&eDense Solar&7: hasta 4 SCU/t, búfer de 800 SCU."
      - "&6Celdas PV"
      - "&7Una PV Cell dura unos 9 días de Minecraft generando."
      - "&7Clic derecho al panel con una PV Cell para insertarla."
      - "&7Agáchate + clic izquierdo con la mano vacía para sacarla."
      - "&7La vida restante aparece en su descripción."
      - "&6Consejos"
      - "&7- No todos los motores aceptan mejoras; el menú avisa si"
      - "&7  una mejora es rechazada."
      - "&7- Pon una Battery Box en la misma red como reserva para"
      - "&7  la noche o la falta de combustible."

  machines:
    title: "Máquinas de procesado"
    summary: "Smelter, Masher, Sawmill, Energizer y más"
    lines:
      - "&6Menú común de las máquinas"
      - "&b Paneles cian&7: entrada.  &6Paneles naranjas&7: salida."
      - "&7- Ranuras de mejoras, ranura de carga y medidor de carga."
      - "&7- Botón de redstone: &fIgnore / High / Low / Pulsed&7."
      - "&7- Botón de acceso: &fPublic / Private / Restricted&7."
      - "&7Las tolvas y el Item Router pueden meter y sacar ítems."
      - "&eSmelter&7: horno eléctrico más rápido y eficiente."
      - "&7 Funde polvos en lingotes y Quartz Dust en silicio."
      - "&eMasher&7: tritura recursos. Ejemplos:"
      - "&7 Mena de hierro/oro -> 2 polvos, lingote -> 1 polvo,"
      - "&7 Roca/Grava -> Arena, Hueso -> 5 Polvo de hueso,"
      - "&7 Vara de blaze -> 4 Polvo, Mena de carbón -> 2 Carbón,"
      - "&7 Mena de redstone -> 6, lapislázuli -> 8, diamante -> 2,"
      - "&7 Lana -> 4 Hilo, Glowstone -> 4 Polvo,"
      - "&7 Hojas -> Tinte verde, Cuarzo -> Quartz Dust."
      - "&eSawmill&7: Tronco -> 6 Tablones, Cofre -> 8 Tablones."
      - "&eElectrical Energizer&7 (60 s por ítem):"
      - "&7 Lingote de hierro/oro -> Lingote energizado,"
      - "&7 Cuarzo -> Energized Quartz,"
      - "&7 Polvo de hierro/oro -> Polvo energizado."
      - "&eFermenter&7: Ojo de araña -> Ojo fermentado,"
      - "&7 Carne podrida -> Fish Bait."
      - "&ePump&7: llena cubos vacíos con el líquido de debajo."
      - "&eFishing Net&7: necesita agua y Fish Bait; pesca sola."
      - "&eAuto Builder&7: mira &f/stb guide tools&7."
      - "&7Recetas y tiempos exactos están en el Recipe Book"
      - "&7(SCU/t y SCU totales por operación)."

  upgrades:
    title: "Mejoras de máquinas"
    summary: "Speed, Thoroughness, Regulator, Ejector"
    lines:
      - "&7Coloca las mejoras en las ranuras de mejoras del menú."
      - "&7Varias mejoras del mismo tipo acumulan su efecto."
      - "&eSpeed Upgrade&7: velocidad x1,4, consumo x1,6."
      - "&eThoroughness Upgrade&7: velocidad x0,7, consumo x1,6"
      - "&7 y probabilidad de producción extra en cada operación."
      - "&eRegulator Upgrade&7: uso más inteligente de recursos; p. ej."
      - "&7 los generadores no desperdician combustible al estar"
      - "&7 llenos. El efecto exacto depende de la máquina."
      - "&eEjector Upgrade&7: expulsa automáticamente lo terminado."
      - "&7 Haz clic izquierdo a un bloque con la mejora en la mano"
      - "&7 para fijar la dirección antes de insertarla."
      - "&6Consejos"
      - "&7- Speed + Thoroughness juntas consumen mucha SCU."
      - "&7- Ejector hacia un cofre o un Item Router con Receiver o"
      - "&7  Sorter crea líneas totalmente automáticas."

  farming:
    title: "Agricultura"
    summary: "Auto Farms, Forester, azadas y riego"
    lines:
      - "&7Las granjas automáticas cosechan y replantan en un área"
      - "&7centrada en la máquina, hasta 2 bloques por encima."
      - "&eAuto Farm&7: trigo, patatas y zanahorias (área 3x3)."
      - "&eAuto Farm MkII&7: cacao, caña de azúcar y cactus"
      - "&7 (área 5x5)."
      - "&eInfernal Farm&7: verrugas del Nether (área 11x11)."
      - "&eAuto Forester&7: tala árboles y replanta los brotes."
      - "&7Lo cosechado va a las ranuras de salida; si están llenas,"
      - "&7la máquina espera. Vacíalas con routers."
      - "&6Combine Hoes&7 (Madera, Hierro, Oro, Diamante)"
      - "&7- Clic der. en tierra/césped: ara un área de 3x3."
      - "&7- Clic der. en tierra de cultivo: siembra 3x3 desde la bolsa."
      - "&7- Clic der. en otro sitio: abre la bolsa de semillas."
      - "&7- Clic izq. en plantas: cosecha un área (mayor en azadas"
      - "&7  mejores). Clic izq. en hojas: rompe un área de 3x3x3."
      - "&eWatering Can&7: clic derecho en cultivos para regarlos y"
      - "&7 acelerar su crecimiento; clic en agua para rellenar."
      - "&7 ¡Regar de más puede dañar el suelo!"
      - "&eMoisture Checker / Advanced&7: clic derecho para medir la"
      - "&7 humedad de la tierra de cultivo en un área."
      - "&eFishing Net&7 + &eFish Bait&7: pesca automática."

  router:
    title: "Item Router"
    summary: "Módulos para mover, ordenar y enviar ítems"
    lines:
      - "&7El &eItem Router&7 mueve ítems con módulos colocados en su"
      - "&7menú (clic derecho al bloque). Tiene un búfer de un ítem"
      - "&7(puedes sacar de él, pero no meter)."
      - "&7Los módulos direccionales usan la cara guardada en el"
      - "&7ítem; se configuran haciendo clic con el módulo en mano."
      - "&ePuller&7: saca ítems del inventario adyacente."
      - "&eSender&7: envía a un inventario adyacente O a un router"
      - "&7 con Receiver a 10 bloques como máximo y en línea recta."
      - "&eAdv. Sender&7: envía a un Receiver enlazado a 24 bloques,"
      - "&7 sin línea de visión. Clic izq. a un router con Receiver"
      - "&7 para enlazar; agáchate + clic izq. para desenlazar."
      - "&eHypersender&7: como Adv. Sender pero a cualquier distancia"
      - "&7 y en cualquier mundo."
      - "&eReceiver&7: pasivo, recibe ítems de los senders."
      - "&eDistributor&7: saca de su dirección y reparte por turnos"
      - "&7 a todos los demás inventarios adyacentes."
      - "&eSorter&7: solo inserta en inventarios vacíos o que ya"
      - "&7 contienen ese ítem."
      - "&eDropper&7: suelta los ítems en el suelo."
      - "&eVacuum&7: aspira ítems tirados en un radio de 6 bloques."
      - "&eBreaker / Silky Breaker&7: rompe el bloque de enfrente y"
      - "&7 lo guarda (Silky requiere un libro Silk Touch)."
      - "&6Mejoras pasivas"
      - "&eSpeed module&7: 0=1 op/20t, 1=1/15, 2=1/10, 3=1/5 (máx. 3)."
      - "&eStack module&7: duplica los ítems por operación (máx. 6)."
      - "&6Filtros"
      - "&7Casi todos los módulos aceptan filtro: lista blanca/negra"
      - "&7y coincidencia por material, por ítem o por datos exactos."
      - "&7Los routers respetan su modo de redstone como cualquier"
      - "&7máquina. Los módulos se fabrican desde un &eBlank Module&7."

  storage:
    title: "Almacenamiento"
    summary: "BSU, HSU y la papelera"
    lines:
      - "&eBSU&7 (Big Storage Unit): hasta 128 stacks de un único"
      - "&7 tipo de ítem. No necesita energía. Tubos y routers pueden"
      - "&7 meter y sacar. Puedes bloquearla a un tipo para que lo"
      - "&7 conserve aunque se vacíe."
      - "&eHSU&7 (Hyper Storage Unit): hasta 2^31 ítems de un tipo."
      - "&7 Necesita energía (búfer de 1.000 SCU) y conserva su"
      - "&7 contenido al romperla."
      - "&6Uso de las unidades"
      - "&7- La ranura de entrada solo acepta el tipo guardado."
      - "&7- La ranura de salida siempre ofrece un stack listo."
      - "&7- La descripción muestra el ítem bloqueado y la cantidad."
      - "&eTrash Can&7: DESTRUYE todo lo que se le mete o canaliza."
      - "&7 ¡Revísalo bien antes de usarla como desborde!"
      - "&7El almacenamiento Ender (Ender Box/Bag) tiene su tema:"
      - "&f/stb guide ender"

  ender:
    title: "Almacenamiento Ender"
    summary: "Ender Box, Ender Bag, Tuner y canales"
    lines:
      - "&7El almacenamiento Ender comparte un inventario entre los"
      - "&7bloques e ítems sintonizados a la misma &efrecuencia&7."
      - "&eEnder Box&7: bloque. Clic derecho con un &eEnder Tuner&7"
      - "&7 para fijar su frecuencia."
      - "&eEnder Bag&7: portátil. Clic derecho para abrir; agáchate"
      - "&7 + clic derecho a una Ender Box para copiar su frecuencia."
      - "&eEnder Tuner&7: clic derecho a una Ender Box para"
      - "&7 sintonizarla, en otro sitio abre el menú de sintonía."
      - "&6Personal o Global"
      - "&7Los canales personales son de un jugador; los globales"
      - "&7los comparte todo el que use esa frecuencia."
      - "&7- Clic derecho a una Ender Box Global con un &bDiamante&7:"
      - "&7  se bloquea en PERSONAL para ti (se consume el diamante)."
      - "&7- Agáchate + clic derecho a tu caja Personal con un"
      - "&7  diamante para volverla GLOBAL (se devuelve el diamante)."
      - "&6Modalidades"
      - "&7Los canales se aíslan por modalidad configurada por el"
      - "&7servidor (p. ej. survival y skyblock). Todas las"
      - "&7dimensiones de una modalidad comparten contenido; los"
      - "&7ítems nunca pasan de una modalidad a otra."
      - "&7Los jugadores en creativo pueden tener bloqueado el acceso"
      - "&7(&fcreative_ender_access&7 en la configuración)."

  tools:
    title: "Herramientas"
    summary: "Constructores, pintura, medición y utilidades"
    lines:
      - "&eAngelic Block&7: clic derecho para colocar un bloque en el"
      - "&7 aire; clic izquierdo para romperlo al instante."
      - "&eEnder Leash&7: clic derecho a un animal pacífico para"
      - "&7 capturarlo, clic derecho a un bloque para soltarlo."
      - "&eMultibuilder&7 (10.000 SCU): modo BUILD - clic izq."
      - "&7 previsualiza, clic der. construye sobre la cara elegida,"
      - "&7 agachado + clic der. construye uno. Agachado + rueda del"
      - "&7 ratón cambia a modo EXCHANGE (reemplaza bloques)."
      - "&7 Gasta SCU por bloque."
      - "&eAuto Builder&7 (10.000 SCU): coloca en su menú dos &eLand"
      - "&eMarkers&7 con esquinas opuestas, elige un modo -"
      - "&f CLEAR, FILL, WALLS, FRAME&7 - llena su inventario con"
      - "&7 bloques y pulsa Start."
      - "&eLand Marker&7: clic derecho a un bloque guarda la"
      - "&7 posición, clic derecho al aire la borra."
      - "&ePaintbrush&7: pinta lana, alfombra, terracota y cristal."
      - "&7 Clic der.: pinta bloques conectados hasta el límite;"
      - "&7 agachado + clic der.: un bloque; agachado + clic der. al"
      - "&7 aire: vacía la brocha. Clic der. a cuadros: cambia arte."
      - "&ePaint Roller&7: como la brocha, para áreas planas grandes."
      - "&ePaint Can&7: clic derecho con la brocha para rellenarla."
      - "&7 Si no, abre un mezclador: cubo de leche + tinte = pintura;"
      - "&7 también puedes teñir ítems dentro."
      - "&eTape Measure&7: agachado + clic der. fija un ancla,"
      - "&7 clic der. a otro bloque muestra la distancia."
      - "&eMultimeter&7: inspecciona redes de energía y máquinas."
      - "&eRecipe Book / Advanced&7: consulta y fabrica recetas; el"
      - "&7 avanzado toma ingredientes de inventarios cercanos."

  redstone:
    title: "Redstone y bloques útiles"
    summary: "Reloj, BUD, Ascensor, Silenciador"
    lines:
      - "&eRedstone Clock&7: emite pulsos con intervalo y duración"
      - "&7 configurables. Clic derecho para configurarlo."
      - "&eBlock Update Detector&7 (BUD): emite un pulso cuando un"
      - "&7 bloque adyacente cambia. Ajusta duración y espera."
      - "&eElevator&7: apila ascensores en vertical; párate encima y"
      - "&7 pulsa Espacio para subir o Shift para bajar al siguiente."
      - "&eSound Muffler&7: baja el volumen de todos los sonidos en"
      - "&7 8 bloques; volumen en su menú (requiere ProtocolLib)."
      - "&6Modos de redstone de las máquinas"
      - "&eIgnore&7: siempre funciona.  &eHigh&7: solo con señal."
      - "&eLow&7: solo SIN señal."
      - "&ePulsed&7: una operación por cada pulso de redstone."
      - "&7Modo por defecto de bloques nuevos: &fdefault_redstone&7."

  components:
    title: "Componentes y recursos"
    summary: "Polvos, circuitos, marcos y silicio"
    lines:
      - "&eIron / Gold Dust&7: del Masher; fúndelos en Smelter u"
      - "&7 horno (las menas dan 2 polvos = duplicación)."
      - "&eInfernal Dust&7: lo sueltan a veces los blazes (Looting"
      - "&7 ayuda). Combínalo con polvo de hierro u oro."
      - "&eEnergized Iron/Gold Dust, Ingots, Quartz&7: se hacen en el"
      - "&7 Electrical Energizer; sirven para recetas avanzadas."
      - "&eQuartz Dust&7 -> Smelter -> &eSilicon Wafer&7."
      - "&eCircuit Board&7, &eSimple Circuit&7, &eIntegrated Circuit&7:"
      - "&7 electrónica para máquinas (Integrated usa silicio)."
      - "&eMachine Frame&7 / &eTough Machine Frame&7: base de casi"
      - "&7 todas las máquinas; los tough para las avanzadas."
      - "&eSubspace Transponder&7: comunicación entre mundos para"
      - "&7 los SCU Relay."
      - "&ePV Cell&7: consumible de los generadores solares."
      - "&eFish Bait&7: del Fermenter (carne podrida)."
      - "&7Consejo: &f/stb recipe <nombre>&7 abre el Recipe Book"
      - "&7filtrado por nombre."

  security:
    title: "Acceso y amigos"
    summary: "Bloques públicos, privados y restringidos"
    lines:
      - "&7Cada bloque STB tiene un dueño (quien lo colocó) y un modo"
      - "&7de acceso, que se cambia con el candado de su menú:"
      - "&ePublic&7: cualquiera puede usarlo."
      - "&ePrivate&7: solo el dueño."
      - "&eRestricted&7: el dueño y sus amigos."
      - "&7Por defecto en bloques nuevos: &fdefault_access&7."
      - "&6Amigos"
      - "&f/stb friend&7 - lista tus amigos."
      - "&f/stb friend <jugador>&7 - añade un amigo."
      - "&f/stb unfriend <jugador>&7 - quita un amigo."
      - "&7Solo se aceptan jugadores que ya entraron al servidor."
      - "&7El staff con &fstb.friends.other&7 gestiona los de otros."
      - "&7El staff con &fstb.access.any&7 ignora los modos de acceso."
      - "&7También se respetan los plugins de protección de zonas."

  commands:
    title: "Comandos"
    summary: "Todos los comandos /stb y sus permisos"
    lines:
      - "&f/stb guide [tema] [página] [es|en]&7 - esta guía."
      - "&f/stb guide search <palabra>&7 - busca en la guía."
      - "&f/stb recipe <filtro>&7 - abre el Recipe Book filtrado"
      - "&7 (necesitas un Recipe Book en el inventario)."
      - "&f/stb friend [jugador]&7 - lista o añade amigos."
      - "&f/stb unfriend <jugador>&7 - quita un amigo."
      - "&6Comandos de staff&7 (op por defecto)"
      - "&f/stb give <ítem> [cantidad] [jugador]&7 - da ítems STB."
      - "&f/stb show [-w mundo] [-type id] [-perf]&7 - lista bloques"
      - "&7 STB; -perf muestra datos de rendimiento."
      - "&f/stb charge <cantidad>&7 - fija la SCU del ítem en mano o"
      - "&7 de la máquina apuntada."
      - "&f/stb examine&7 - muestra los datos del ítem en mano."
      - "&f/stb getcfg [clave]&7 / &f/stb setcfg <clave> <valor>&7 -"
      - "&7 lee o cambia la configuración en vivo."
      - "&f/stb save&7 - fuerza el guardado de todos los datos."
      - "&f/stb validate&7 - revisa y repara los datos de bloques."
      - "&f/stb redraw [-type id] [-w mundo]&7 - redibuja bloques."
      - "&f/stb rmframe&7 - quita un marco de portal huérfano."
      - "&f/stb debug [nivel]&7 - fija el nivel de depuración."
      - "&f/stb sound <nombre> [volumen] [tono]&7 - reproduce sonido."
      - "&7Los permisos siguen &fstb.commands.<nombre>&7; &fstb.admin"
      - "&7otorga todos los permisos de staff."

  admin:
    title: "Administración del servidor"
    summary: "Configuración, permisos y mantenimiento"
    lines:
      - "&7Configuración: &fplugins/SensibleToolbox/config.yml&7."
      - "&7Cambia valores en vivo con &f/stb setcfg <clave> <valor>&7."
      - "&6Claves de configuración"
      - "&f save_interval&7 - segundos entre guardados automáticos."
      - "&f energy.tick_rate&7 - ticks entre actualizaciones de energía."
      - "&f particle_effects&7 - nivel de partículas (0 = ninguna)."
      - "&f noisy_machines&7 - sonidos de máquinas sí/no."
      - "&f default_access&7 - public / private / restricted."
      - "&f default_redstone&7 - ignore / high / low / pulsed."
      - "&f creative_ender_access&7 - inventarios Ender en creativo."
      - "&f gui.texture.*&7 - paneles usados en los menús."
      - "&f items_enabled.<id>&7 - desactiva ítems sueltos."
      - "&f enderstorage.modalities&7 - prefijo de mundo -> modalidad."
      - "&6Permisos útiles"
      - "&f stb.admin&7 - todos los permisos de staff."
      - "&f stb.access.any&7 - ignora los modos de acceso."
      - "&f stb.recipebook.freefab&7 - fabrica sin coste."
      - "&f stb.enderaccess.creative&7 - acceso Ender en creativo."
      - "&f stb.commands.guide&7 - esta guía (por defecto: todos)."
      - "&6Mantenimiento"
      - "&7Usa &f/stb validate&7 tras un crash y &f/stb save&7 antes"
      - "&7de detener el servidor a mano."
      - "&7Reporta errores en github.com/SlimefunNewHorizons."

  compat:
    title: "Compatibilidad"
    summary: "Versiones de Minecraft y Java soportadas"
    lines:
      - "&7Esta versión soporta estos servidores:"
      - "&e Minecraft 1.21.11&7 (Paper/Purpur) con Java 21+."
      - "&e Minecraft 26.1.x&7 (Paper/Purpur) con Java 25."
      - "&e Minecraft 26.2.x&7 (Paper/Purpur) con Java 25."
      - "&7El mismo jar funciona en las tres versiones."
      - "&7Cualquier otra versión se rechaza al iniciar para que los"
      - "&7datos nunca se corrompan en un servidor no probado."
      - "&6Requisitos"
      - "&7- Slimefun4 (edición Drake) para la guía, investigaciones"
      - "&7  y categorías de ítems."
      - "&7- Opcional: ProtocolLib (Sound Muffler),"
      - "&7  HolographicDisplays (Holographic Monitor)."

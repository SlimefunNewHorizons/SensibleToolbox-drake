# SensibleToolbox in-game guide (English). Shown with /stb guide [topic] [page] en
# Legacy '&' color codes are allowed. Every topic id must also exist in guide_es.yml.
title: "STB Guide"

ui:
  index_header: "Index"
  index_intro: "&7Click a topic to open it, or type &f/stb guide <topic>&7."
  index_hint: "&7Search: &f/stb guide search <word>&7  |  Language: &fen&7 / &fes"
  topic_hover: "&eClick to open this topic"
  page: "&7Page &f{page}&7/&f{pages}"
  prev: "&a[« Previous]"
  prev_hover: "&7Go to the previous page"
  next: "&a[Next »]"
  next_hover: "&7Go to the next page"
  back_to_index: "&b[Index]"
  back_to_index_hover: "&7Back to the topic list"
  switch_language: "&d[Ver en Español]"
  switch_language_hover: "&7Cambiar la guía a español"
  unknown_topic: "&cUnknown topic: &f{topic}&c. Pick one from the index:"
  search_header: "Search: {term}"
  search_none: "&7No topic mentions &f{term}&7."
  search_usage: "&cUsage: &f/stb guide search <word>"

topics:
  start:
    title: "Getting started"
    summary: "What STB is and how to unlock it"
    lines:
      - "&fSensibleToolbox (STB) adds machines, logistics, SCU"
      - "&fenergy, storage and handy tools on top of Slimefun."
      - "&6Where are the items?"
      - "&7Open &f/sf guide&7: STB uses two categories,"
      - "&e STB - Items &7and &eSTB - Blocks and Machines&7."
      - "&6Research (Slimefun XP levels)"
      - "&7- &eTools and Components&7: &f20 levels"
      - "&7- &eMachinery and Energy&7: &f35 levels"
      - "&7- &eHyperspatial Storage&7: &f45 levels"
      - "&7Unlock a research once; then craft its items normally."
      - "&6Crafting"
      - "&7Most items use the vanilla crafting table. Some come"
      - "&7from machines (dusts, energized ingots, silicon)."
      - "&7The &eRecipe Book&7 lists and can fabricate every recipe;"
      - "&7search it with &f/stb recipe <text>&7."
      - "&6Suggested progression"
      - "&71. Tools: Combine Hoe, Paintbrush, Tape Measure."
      - "&72. Machine Frame + Simple Circuit, then a Heat Engine."
      - "&73. Iron Bars as cables, a Battery Box and a Masher."
      - "&74. Smelter and Electrical Energizer for advanced parts."
      - "&75. Item Router modules, BSU/HSU storage, Auto Farms."
      - "&76. SCU Relays and Hypersender for cross-world networks."
      - "&6Interacting with blocks"
      - "&7Right-click most STB blocks to open their GUI. Breaking"
      - "&7a block returns it with its stored data where possible."
      - "&7Read &f/stb guide energy &7next."

  energy:
    title: "SCU energy"
    summary: "Cables, energy nets, charge and batteries"
    lines:
      - "&fSTB machines run on &eSCU&f (Sensible Charge Units)."
      - "&7Rates are shown as &fSCU/t&7 (per server tick, 20 t = 1 s)."
      - "&6Cables and energy nets"
      - "&7&fIron Bars&7 are the energy cables. Touching cables form"
      - "&7an &eenergy net&7; every STB machine adjacent to that net"
      - "&7joins it. Generators push power in, consumers pull it."
      - "&7Placing a cable merges nets, breaking one may split it."
      - "&7Energy is distributed every &fenergy.tick_rate&7 ticks."
      - "&6Machine charge"
      - "&7Each machine has an internal buffer (max charge) and a"
      - "&7max charge rate. The charge meter in its GUI shows both."
      - "&6Charge slot and direction"
      - "&7Machines have a charge slot for Energy Cells. The"
      - "&7charge-direction button chooses the flow:"
      - "&e MACHINE&7: the cell charges the machine."
      - "&e CELL&7: the machine charges the cell."
      - "&6Storage"
      - "&e10K Battery Box&7: 10,000 SCU, 100 SCU/t."
      - "&e50K Battery Box&7: 50,000 SCU, 500 SCU/t."
      - "&7Battery boxes only exchange power while their redstone"
      - "&7mode allows it (default: ignore redstone = always on)."
      - "&e10K / 50K Energy Cell&7: portable, 100 / 500 SCU/t."
      - "&6Long-distance power"
      - "&eSCU Relay&7: craft two &eUnlinked SCU Relays&7 together to"
      - "&7get a linked pair (100,000 SCU shared). Both partners"
      - "&7always hold the same SCU level and work only when both"
      - "&7are placed. For partners on different worlds insert a"
      - "&eSubspace Transponder&7 in each relay. L-click: refresh."
      - "&6Measuring"
      - "&eMultimeter&7: R-click cables or machines to see the net,"
      - "&7charge and producers/consumers."
      - "&ePower Monitor&7: shows net gain/loss on attached signs."
      - "&eHolographic Monitor&7: same, as a hologram"
      - "&7(needs HolographicDisplays)."

  generators:
    title: "Generators"
    summary: "Heat, Bio, Magmatic and Solar power"
    lines:
      - "&7Generators fill their buffer, then feed the energy net."
      - "&7They slow fuel burn when their buffer is over 75 percent."
      - "&eHeat Engine&7: burns anything a furnace can burn."
      - "&7 Buffer 5,000 SCU, 50 SCU/t."
      - "&eBio Engine&7: converts organic items (crops, saplings,"
      - "&7 food...) into power. Buffer 2,500 SCU, 50 SCU/t."
      - "&eMagmatic Engine&7: converts lava buckets into power."
      - "&7 Buffer 2,500 SCU, 50 SCU/t. Empty buckets are returned."
      - "&7Fuel lists are visible in the Slimefun guide entry of"
      - "&7each engine."
      - "&eBasic Solar&7: up to 0.5 SCU/t in bright sunlight with"
      - "&7 open sky above. Needs a &ePV Cell&7 installed."
      - "&eDense Solar&7: up to 4 SCU/t, 800 SCU buffer."
      - "&6PV Cells"
      - "&7A PV Cell lasts about 9 Minecraft days of generation."
      - "&7R-click a solar with a PV Cell to insert it directly."
      - "&7Sneak + L-click the solar with an empty hand to take"
      - "&7the cell out. Its remaining life is shown in the lore."
      - "&6Tips"
      - "&7- Upgrades are not accepted by every engine; the GUI"
      - "&7  tells you if one is refused."
      - "&7- Put a Battery Box on the same net as a buffer for"
      - "&7  night time or fuel gaps."

  machines:
    title: "Processing machines"
    summary: "Smelter, Masher, Sawmill, Energizer and more"
    lines:
      - "&6Common machine GUI"
      - "&b Cyan panes&7: input slots.  &6Orange panes&7: output slots."
      - "&7- Upgrade slots, charge slot and charge meter."
      - "&7- Redstone button: &fIgnore / High / Low / Pulsed&7."
      - "&7- Access button: &fPublic / Private / Restricted&7."
      - "&7Hoppers and Item Routers can insert and extract."
      - "&eSmelter&7: a faster, more efficient powered furnace."
      - "&7 Smelts dusts into ingots and Quartz Dust into silicon."
      - "&eMasher&7: grinds resources. Examples:"
      - "&7 Iron/Gold ore -> 2 dust, ingot -> 1 dust,"
      - "&7 Cobblestone/Gravel -> Sand, Bone -> 5 Bone Meal,"
      - "&7 Blaze Rod -> 4 Powder, Coal ore -> 2 Coal,"
      - "&7 Redstone ore -> 6, Lapis ore -> 8, Diamond ore -> 2,"
      - "&7 Wool -> 4 String, Glowstone -> 4 Dust,"
      - "&7 Leaves -> Green Dye, Quartz -> Quartz Dust."
      - "&eSawmill&7: Log -> 6 Planks, Chest -> 8 Oak Planks."
      - "&eElectrical Energizer&7 (60 s per item):"
      - "&7 Iron/Gold Ingot -> Energized Ingot,"
      - "&7 Quartz -> Energized Quartz,"
      - "&7 Iron/Gold Dust -> Energized Dust."
      - "&eFermenter&7: Spider Eye -> Fermented Spider Eye,"
      - "&7 Rotten Flesh -> Fish Bait."
      - "&ePump&7: fills empty buckets from the liquid below it."
      - "&eFishing Net&7: needs water and Fish Bait, catches fish."
      - "&eAuto Builder&7: see &f/stb guide tools&7."
      - "&7Exact recipes and times are in the Recipe Book lore"
      - "&7(SCU/t and total SCU per operation)."

  upgrades:
    title: "Machine upgrades"
    summary: "Speed, Thoroughness, Regulator, Ejector"
    lines:
      - "&7Place upgrades in the upgrade slots of a machine GUI."
      - "&7Several upgrades of the same kind stack their effect."
      - "&eSpeed Upgrade&7: speed x1.4, power usage x1.6."
      - "&eThoroughness Upgrade&7: speed x0.7, power usage x1.6"
      - "&7 and a bonus-output chance on each operation."
      - "&eRegulator Upgrade&7: smarter resource usage; e.g."
      - "&7 generators stop wasting fuel when full. The exact"
      - "&7 effect depends on the machine."
      - "&eEjector Upgrade&7: finished items are pushed out"
      - "&7 automatically. L-click a block with the upgrade to"
      - "&7 set the ejection direction before inserting it."
      - "&6Tips"
      - "&7- Speed + Thoroughness together cost a lot of SCU."
      - "&7- Ejector into a chest or an Item Router with a"
      - "&7  Receiver/Sorter makes fully automatic lines."

  farming:
    title: "Farming"
    summary: "Auto Farms, Forester, hoes and watering"
    lines:
      - "&7Auto farms harvest and replant crops in an area"
      - "&7centred on the machine, up to 2 blocks above it."
      - "&eAuto Farm&7: wheat, potatoes, carrots (3x3 area)."
      - "&eAuto Farm MkII&7: cocoa beans, sugar cane and cactus"
      - "&7 (5x5 area)."
      - "&eInfernal Farm&7: nether wart (11x11 area)."
      - "&eAuto Forester&7: cuts trees and replants saplings."
      - "&7Harvested items go to the output slots; if they are"
      - "&7full the machine waits. Empty them with routers."
      - "&6Combine Hoes&7 (Wood, Iron, Gold, Diamond)"
      - "&7- R-click dirt/grass: till a 3x3 area."
      - "&7- R-click farmland: sow 3x3 from the seed bag."
      - "&7- R-click elsewhere: open the seed bag."
      - "&7- L-click plants: harvest an area (larger on better"
      - "&7  hoes). L-click leaves: break a 3x3x3 area."
      - "&eWatering Can&7: R-click crops to irrigate and speed"
      - "&7 growth; R-click water to refill. Over-watering can"
      - "&7 harm the soil!"
      - "&eMoisture Checker / Advanced&7: R-click to check farmland"
      - "&7 saturation in an area."
      - "&eFishing Net&7 + &eFish Bait&7: automatic fishing."

  router:
    title: "Item Router"
    summary: "Modules for moving, sorting and sending items"
    lines:
      - "&7The &eItem Router&7 moves items using modules placed in"
      - "&7its GUI (R-click the block). It has a one-item buffer"
      - "&7(you can take items out, not put them in)."
      - "&7Directional modules use the face set in their item;"
      - "&7configure them by clicking with the module in hand."
      - "&ePuller&7: pulls items from the adjacent inventory."
      - "&eSender&7: sends to an adjacent inventory OR to a router"
      - "&7 with a Receiver up to 10 blocks away in line of sight."
      - "&eAdv. Sender&7: sends to a linked Receiver within 24"
      - "&7 blocks, no line of sight. L-click a router that has a"
      - "&7 Receiver to link; sneak + L-click to unlink."
      - "&eHypersender&7: like Adv. Sender but any distance and any"
      - "&7 world."
      - "&eReceiver&7: passive, accepts items from senders."
      - "&eDistributor&7: pulls from its direction and sends"
      - "&7 round-robin to all other adjacent inventories."
      - "&eSorter&7: inserts only into inventories that are empty"
      - "&7 or already contain that item."
      - "&eDropper&7: drops items on the ground."
      - "&eVacuum&7: sucks up dropped items within 6 blocks."
      - "&eBreaker / Silky Breaker&7: breaks the facing block and"
      - "&7 stores it (Silky needs a Silk Touch book to craft)."
      - "&6Passive upgrades"
      - "&eSpeed module&7: 0=1 op/20t, 1=1/15, 2=1/10, 3=1/5 (max 3)."
      - "&eStack module&7: doubles items moved per op (max 6)."
      - "&6Filters"
      - "&7Most modules accept a filter: whitelist/blacklist and"
      - "&7match by material, by item or by exact data."
      - "&7Routers obey their redstone mode like any machine."
      - "&7Craft modules from a &eBlank Item Router Module&7."

  storage:
    title: "Storage"
    summary: "BSU, HSU and the Trash Can"
    lines:
      - "&eBSU&7 (Big Storage Unit): up to 128 stacks of a single"
      - "&7 item type. No power needed. Pipes and routers can"
      - "&7 insert/extract. You can lock it to one item type so"
      - "&7 it keeps that type even when empty."
      - "&eHSU&7 (Hyper Storage Unit): up to 2^31 items of one"
      - "&7 type. Needs power (1,000 SCU buffer) to work and"
      - "&7 keeps its contents when broken."
      - "&6Using storage units"
      - "&7- The input slot accepts the stored type only."
      - "&7- The output slot always shows a stack ready to take."
      - "&7- The lore shows the locked item and the amount."
      - "&eTrash Can&7: DESTROYS anything placed or piped into it."
      - "&7 Double-check before using it as an overflow!"
      - "&7Ender storage (Ender Box/Bag) has its own topic:"
      - "&f/stb guide ender"

  ender:
    title: "Ender storage"
    summary: "Ender Box, Ender Bag, Tuner and channels"
    lines:
      - "&7Ender storage shares an inventory between blocks/items"
      - "&7tuned to the same &efrequency&7 (channel number)."
      - "&eEnder Box&7: a block. R-click with an &eEnder Tuner&7 to"
      - "&7 set its frequency."
      - "&eEnder Bag&7: portable. R-click to open; sneak + R-click"
      - "&7 an Ender Box to copy its frequency."
      - "&eEnder Tuner&7: R-click an Ender Box to tune it,"
      - "&7 R-click elsewhere to open the tuning GUI."
      - "&6Personal vs Global"
      - "&7Personal channels belong to one player; Global channels"
      - "&7are shared by everyone using that frequency."
      - "&7- R-click a Global Ender Box with a &bDiamond&7: it locks"
      - "&7  to PERSONAL for you (the diamond is consumed)."
      - "&7- Sneak + R-click your Personal box with a Diamond to"
      - "&7  unlock it back to GLOBAL (the diamond is returned)."
      - "&6Modalities"
      - "&7Channels are isolated per game mode/modality set by the"
      - "&7server (e.g. survival vs skyblock). All dimensions of a"
      - "&7modality share contents; items never cross modalities."
      - "&7Creative players may be blocked from ender inventories"
      - "&7(&fcreative_ender_access&7 in the config)."

  tools:
    title: "Tools"
    summary: "Builders, paint, measuring and utility items"
    lines:
      - "&eAngelic Block&7: R-click to place a block in mid-air;"
      - "&7 L-click it to break it instantly."
      - "&eEnder Leash&7: R-click a peaceful animal to capture it,"
      - "&7 R-click a block to release it."
      - "&eMultibuilder&7 (10,000 SCU): BUILD mode - L-click"
      - "&7 previews, R-click builds on the clicked face, sneak +"
      - "&7 R-click builds one. Sneak + mouse wheel switches to"
      - "&7 EXCHANGE mode (swap blocks). Costs SCU per block."
      - "&eAuto Builder&7 (10,000 SCU): place two &eLand Markers&7 set"
      - "&7 to opposite corners in its GUI, choose a mode -"
      - "&f CLEAR, FILL, WALLS, FRAME&7 - fill its inventory with"
      - "&7 blocks and press Start."
      - "&eLand Marker&7: R-click a block to store the position,"
      - "&7 R-click air to clear it."
      - "&ePaintbrush&7: paints wool, carpet, terracotta and glass."
      - "&7 R-click: paint up to the brush limit of connected"
      - "&7 blocks; sneak + R-click: one block; sneak + R-click"
      - "&7 air: empty the brush. R-click paintings: change art."
      - "&ePaint Roller&7: like the brush, for larger flat areas."
      - "&ePaint Can&7: R-click with a brush to refill. Otherwise"
      - "&7 opens a mixer: milk bucket + dye = paint; you can also"
      - "&7 dye items inside."
      - "&eTape Measure&7: sneak + R-click sets an anchor,"
      - "&7 R-click another block shows the distance."
      - "&eMultimeter&7: inspect energy nets and machines."
      - "&eRecipe Book / Advanced&7: browse and fabricate recipes;"
      - "&7 the advanced book pulls ingredients from nearby"
      - "&7 inventories."

  redstone:
    title: "Redstone and utility blocks"
    summary: "Clock, BUD, Elevator, Sound Muffler"
    lines:
      - "&eRedstone Clock&7: emits pulses with configurable interval"
      - "&7 and duration. R-click to configure."
      - "&eBlock Update Detector&7 (BUD): pulses when an adjacent"
      - "&7 block changes. Configure pulse duration and sleep time."
      - "&eElevator&7: stack elevators vertically; stand on one,"
      - "&7 press Space to go up or Shift to go down to the next."
      - "&eSound Muffler&7: lowers the volume of all sounds within"
      - "&7 8 blocks; volume set in its GUI (needs ProtocolLib)."
      - "&6Redstone modes for machines"
      - "&eIgnore&7: always runs.  &eHigh&7: runs only when powered."
      - "&eLow&7: runs only when NOT powered."
      - "&ePulsed&7: does one operation per redstone pulse."
      - "&7Default mode for new blocks: &fdefault_redstone&7."

  components:
    title: "Components and resources"
    summary: "Dusts, circuits, frames and silicon"
    lines:
      - "&eIron / Gold Dust&7: from the Masher; smelt in a Smelter"
      - "&7 or furnace to get ingots (ores give 2 dust = doubling)."
      - "&eInfernal Dust&7: sometimes dropped by blazes (Looting"
      - "&7 helps). Combine with iron/gold dust."
      - "&eEnergized Iron/Gold Dust, Ingots, Quartz&7: made in the"
      - "&7 Electrical Energizer; used in advanced recipes."
      - "&eQuartz Dust&7 -> Smelter -> &eSilicon Wafer&7."
      - "&eCircuit Board&7, &eSimple Circuit&7, &eIntegrated Circuit&7:"
      - "&7 electronics for machines (Integrated uses silicon)."
      - "&eMachine Frame&7 / &eTough Machine Frame&7: the body of most"
      - "&7 machines; tough frames for advanced ones."
      - "&eSubspace Transponder&7: cross-world communication for"
      - "&7 SCU Relays."
      - "&ePV Cell&7: consumable for solar generators."
      - "&eFish Bait&7: from the Fermenter (rotten flesh)."
      - "&7Tip: &f/stb recipe <name>&7 opens the Recipe Book"
      - "&7filtered by name."

  security:
    title: "Access and friends"
    summary: "Public, private and restricted blocks"
    lines:
      - "&7Every STB block has an owner (whoever placed it) and an"
      - "&7access mode, set with the padlock button in its GUI:"
      - "&ePublic&7: anyone can use it."
      - "&ePrivate&7: only the owner."
      - "&eRestricted&7: the owner and the owner's friends."
      - "&7Default for new blocks: &fdefault_access&7."
      - "&6Friends"
      - "&f/stb friend&7 - list your friends."
      - "&f/stb friend <player>&7 - add a friend."
      - "&f/stb unfriend <player>&7 - remove a friend."
      - "&7Only players that have joined the server are accepted."
      - "&7Staff with &fstb.friends.other&7 can manage others."
      - "&7Staff with &fstb.access.any&7 bypass access modes."
      - "&7Region protection plugins are also respected."

  commands:
    title: "Commands"
    summary: "Every /stb command and its permission"
    lines:
      - "&f/stb guide [topic] [page] [en|es]&7 - this guide."
      - "&f/stb guide search <word>&7 - search the guide."
      - "&f/stb recipe <filter>&7 - open the Recipe Book filtered"
      - "&7 (needs a Recipe Book in your inventory)."
      - "&f/stb friend [player]&7 - list or add friends."
      - "&f/stb unfriend <player>&7 - remove a friend."
      - "&6Staff commands&7 (op by default)"
      - "&f/stb give <item> [amount] [player]&7 - give STB items."
      - "&f/stb show [-w world] [-type id] [-perf]&7 - list STB"
      - "&7 blocks, with -perf for timing information."
      - "&f/stb charge <amount>&7 - set the SCU of the held item or"
      - "&7 targeted machine."
      - "&f/stb examine&7 - dump the data of the held item."
      - "&f/stb getcfg [key]&7 / &f/stb setcfg <key> <value>&7 - read"
      - "&7 or change the configuration live."
      - "&f/stb save&7 - force-save all plugin data."
      - "&f/stb validate&7 - check and repair STB block data."
      - "&f/stb redraw [-type id] [-w world]&7 - repaint blocks."
      - "&f/stb rmframe&7 - remove an orphaned end portal frame."
      - "&f/stb debug [level]&7 - set the debug level."
      - "&f/stb sound <name> [volume] [pitch]&7 - play a sound."
      - "&7Permissions follow &fstb.commands.<name>&7; &fstb.admin"
      - "&7grants all staff permissions."

  admin:
    title: "Server administration"
    summary: "Configuration, permissions and maintenance"
    lines:
      - "&7Main config: &fplugins/SensibleToolbox/config.yml&7."
      - "&7Change values live with &f/stb setcfg <key> <value>&7."
      - "&6Config keys"
      - "&f save_interval&7 - seconds between automatic saves."
      - "&f energy.tick_rate&7 - ticks between energy updates."
      - "&f particle_effects&7 - particle level (0 = off)."
      - "&f noisy_machines&7 - machine sounds on/off."
      - "&f default_access&7 - public / private / restricted."
      - "&f default_redstone&7 - ignore / high / low / pulsed."
      - "&f creative_ender_access&7 - ender inventories in creative."
      - "&f gui.texture.*&7 - panes used in the GUIs."
      - "&f items_enabled.<id>&7 - disable single items."
      - "&f enderstorage.modalities&7 - world prefix -> modality."
      - "&6Useful permissions"
      - "&f stb.admin&7 - all staff permissions."
      - "&f stb.access.any&7 - ignore block access modes."
      - "&f stb.recipebook.freefab&7 - fabricate without cost."
      - "&f stb.enderaccess.creative&7 - ender access in creative."
      - "&f stb.commands.guide&7 - this guide (default: everyone)."
      - "&6Maintenance"
      - "&7Use &f/stb validate&7 after crashes and &f/stb save&7"
      - "&7before stopping the server manually."
      - "&7Report bugs at github.com/SlimefunNewHorizons."

  compat:
    title: "Compatibility"
    summary: "Supported Minecraft and Java versions"
    lines:
      - "&7This build supports these server versions:"
      - "&e Minecraft 1.21.11&7 (Paper/Purpur) on Java 21+."
      - "&e Minecraft 26.1.x&7 (Paper/Purpur) on Java 25."
      - "&e Minecraft 26.2.x&7 (Paper/Purpur) on Java 25."
      - "&7The same jar works on all three versions."
      - "&7Any other version is refused at startup so data is"
      - "&7never corrupted by an untested server."
      - "&6Requirements"
      - "&7- Slimefun4 (Drake edition) for the guide, research and"
      - "&7  item categories."
      - "&7- Optional: ProtocolLib (Sound Muffler),"
      - "&7  HolographicDisplays (Holographic Monitor)."
